<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Brownie — ARFOOD.STUDIO</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000; color:#fff;
    font-family:'Montserrat',sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .loading {
    text-align:center;
  }
  .loading-text {
    font-size:11px; letter-spacing:3px; color:#FF6A00;
  }
</style>
</head>
<body>

<div class="loading" id="loadingScreen">
  <div class="loading-text">LOADING...</div>
</div>

<script>
  // Detect device
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isAndroid = /Android/.test(navigator.userAgent);

  // Dish details — change these for different dishes
  const dishName = "Classic Brownie";
  const glbFile = "browni-v1.glb";
  const pngFile = "brownie.png";

  // Get current page's full URL path (without filename) to build absolute paths
  const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  const fullGlbUrl = basePath + glbFile;

  window.addEventListener('DOMContentLoaded', () => {
    if (isAndroid) {
      // ANDROID — Direct redirect to Google Scene Viewer (opens AR instantly)
      const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(fullGlbUrl)}&mode=ar_preferred#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(fullGlbUrl)};end;`;
      window.location.href = intentUrl;
    } else {
      // iPHONE / OTHER — Show simple 3D viewer page (no AR button, just rotate/zoom)
      document.body.innerHTML = `
        <style>
          body { background:#000; color:#fff; font-family:'Montserrat',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
          .header { padding:16px 20px; text-align:center; border-bottom:1px solid rgba(255,106,0,0.15); }
          .brand { font-size:11px; letter-spacing:4px; color:#FF6A00; font-weight:600; }
          .dish-title { font-size:22px; font-weight:300; margin-top:8px; font-family:'Cormorant Garamond',serif; }
          model-viewer { width:100%; height:70vh; background:transparent; --poster-color:transparent; }
          .footer { text-align:center; padding:16px; font-size:9px; letter-spacing:2px; color:rgba(255,255,255,0.3); }
        </style>
        <div class="header">
          <div class="brand">ARFOOD.STUDIO</div>
          <div class="dish-title">${dishName}</div>
        </div>
        <model-viewer src="${glbFile}" poster="${pngFile}"
          camera-controls auto-rotate rotation-per-second="15deg"
          shadow-intensity="0.3" alt="${dishName} 3D View"
          style="flex:1;">
        </model-viewer>
        <div class="footer">ROTATE · ZOOM · EXPLORE</div>
      `;
    }
  });
</script>

</body>
</html>
