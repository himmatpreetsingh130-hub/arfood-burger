<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PUMP UP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap');
  :root{
    --ink:#070a12; --bone:#e8f4ff; --ember:#2ea6ff; --ember-dim:#0d3a5c;
    --volt:#5ff0ff; --steel:#2a3a4a; --line:#1a2836;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; background:var(--ink); font-family:'Space Grotesk', sans-serif; color:var(--bone); overflow:hidden; }
  #app{ position:relative; width:100%; height:100vh; max-width:480px; margin:0 auto; overflow:hidden; }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ============ HOME ============ */
  #screen-home{ padding:24px 20px; background: repeating-linear-gradient(135deg, #070a12, #070a12 2px, #0a1220 2px, #0a1220 40px); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; }
  .coin{ display:flex; align-items:center; gap:6px; background:var(--steel); padding:6px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .coin .dot{ width:14px; height:14px; border-radius:50%; background:var(--volt); }
  .profile-chip{ display:flex; align-items:center; gap:8px; }
  .avatar{ width:34px; height:34px; border-radius:50%; border:2px solid var(--volt); object-fit:cover; }
  .profile-text{ display:flex; flex-direction:column; line-height:1.1; }
  .profile-name{ font-size:12px; font-weight:700; }
  .profile-rank{ font-size:10px; color:var(--volt); text-transform:uppercase; letter-spacing:.05em; }

  .brand{ text-align:center; }
  .brand h1{ font-family:'Archivo Black', sans-serif; font-size:38px; line-height:.95; letter-spacing:-.02em; }
  .brand h1 span{ color:var(--ember); }
  .brand p{ margin-top:10px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--steel); }

  .home-center{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:34px; width:100%; }

  .stack{ display:flex; flex-direction:column; gap:12px; width:100%; }
  .mini-links{ display:flex; justify-content:center; gap:20px; margin-top:6px; }
  .mini-links span{ font-size:11px; color:var(--steel); text-decoration:underline; cursor:pointer; }
  .btn{ font-family:'Archivo Black', sans-serif; font-size:16px; letter-spacing:.05em; padding:16px 18px; border-radius:14px; text-align:center; cursor:pointer; border:2px solid var(--line); transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--ember); color:var(--ink); border-color:var(--ember); box-shadow:0 6px 0 var(--ember-dim); }
  .btn.disabled{ background:transparent; color:var(--steel); border-color:var(--line); cursor:not-allowed; }
  .google-btn{ display:flex; align-items:center; justify-content:center; gap:10px; background:var(--bone); color:#1a1a1a; font-weight:700; font-size:14px; padding:13px 18px; border-radius:14px; cursor:pointer; border:none; width:100%; }
  .google-btn svg{ width:18px; height:18px; }
  .guest-btn{ display:flex; align-items:center; justify-content:center; background:transparent; color:var(--bone); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; padding:13px 18px; border-radius:14px; cursor:pointer; border:2px solid var(--steel); width:100%; }
  .signed-out-cta{ width:100%; text-align:center; display:flex; flex-direction:column; gap:12px; }
  .signed-out-cta p{ font-size:11px; color:var(--steel); }

  @keyframes nodePulse{
    0%, 100% { box-shadow:0 0 0 6px rgba(46,166,255,.22); }
    50% { box-shadow:0 0 0 12px rgba(46,166,255,.08); }
  }

  /* ============ LEVEL MAP ============ */
  #screen-map{ padding:20px 18px; }
  .map-topbar{ display:flex; justify-content:space-between; align-items:center; }
  .back-btn{ font-size:20px; cursor:pointer; background:var(--steel); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .map-title{ font-family:'Archivo Black', sans-serif; font-size:12px; letter-spacing:.15em; color:var(--volt); }
  .path{ position:relative; flex:1; margin-top:20px; }
  .node{ position:absolute; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Archivo Black', sans-serif; font-size:16px; cursor:pointer; border:2px solid var(--line); }
  .node.done{ background:var(--volt); color:var(--ink); }
  .node.open{ background:var(--ember); color:var(--ink); animation:nodePulse 1.6s ease-in-out infinite; }
  .node.locked{ background:var(--steel); color:#6b6e60; cursor:not-allowed; }
  .node.boss{ width:60px; height:60px; font-size:11px; background:linear-gradient(135deg,#ff5a1f,#c8ff3d); color:var(--ink); }
  .n1{ top:4%; left:6%;} .n2{ top:1%; left:30%;} .n3{ top:8%; left:54%;}
  .n4{ top:17%; left:68%;} .n5{ top:26%; left:52%;} .n6{ top:26%; left:26%;}
  .n7{ top:19%; left:4%;} .n8{ top:36%; left:10%;} .n9{ top:45%; left:30%;}
  .n10{ top:44%; left:56%;}
  .nboss{ top:55%; left:40%;}

  .chapter-nav{ display:flex; justify-content:space-between; padding:10px 4px 4px; }
  .chapter-arrow{ font-family:'Archivo Black', sans-serif; font-size:12px; letter-spacing:.05em; color:var(--volt); cursor:pointer; padding:8px 14px; border-radius:10px; background:var(--steel); }
  .chapter-arrow.disabled{ color:var(--line); cursor:not-allowed; opacity:.4; }

  /* ============ WORKOUT ============ */
  #screen-play{ background:#000; }
  .stage{ position:relative; width:100%; height:100%; overflow:hidden; }
  video, canvas{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .scrim-top{ position:absolute; top:0; left:0; right:0; height:180px; background:linear-gradient(180deg, rgba(0,0,0,.65), transparent); z-index:4; pointer-events:none; }
  .scrim-bottom{ position:absolute; bottom:0; left:0; right:0; height:160px; background:linear-gradient(0deg, rgba(0,0,0,.65), transparent); z-index:4; pointer-events:none; }
  .hud{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; padding:20px 18px; pointer-events:none; }
  .hud-top{ display:flex; justify-content:space-between; align-items:center; }
  .timer{ font-family:'Archivo Black', sans-serif; font-size:16px; background:rgba(0,0,0,.5); padding:7px 14px; border-radius:10px; }
  .lvl-badge{ font-family:'Archivo Black', sans-serif; font-size:11px; letter-spacing:.08em; color:var(--ink); background:var(--volt); padding:7px 12px; border-radius:10px; }
  .challenge-wrap{ margin-top:16px; display:flex; align-items:center; gap:10px; }
  .challenge-label{ font-family:'Archivo Black', sans-serif; font-size:13px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .challenge-track{ flex:1; height:12px; background:rgba(42,44,36,.75); border-radius:8px; overflow:hidden; }
  .challenge-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--ember),var(--volt)); transition:width .2s ease; }
  .hero{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .rep-number{ font-family:'Archivo Black', sans-serif; font-size:150px; line-height:.85; text-shadow:0 0 30px rgba(95,240,255,.55), 0 4px 20px rgba(0,0,0,.6); }
  .rep-of{ font-size:14px; letter-spacing:.15em; margin-top:6px; color:#e4e2d8; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .state-pill{ margin-top:14px; font-family:'Archivo Black', sans-serif; font-size:11px; letter-spacing:.1em; background:rgba(0,0,0,.55); color:var(--ember); padding:6px 14px; border-radius:20px; }
  .depth-bar-track{ margin-top:10px; width:120px; height:8px; background:rgba(42,44,36,.6); border-radius:6px; overflow:hidden; }
  .depth-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--volt), var(--ember)); transition:width .1s linear; }
  .bottom-hud{ display:flex; justify-content:space-between; align-items:center; }
  .quit{ font-size:12px; color:#e4e2d8; text-transform:uppercase; letter-spacing:.1em; pointer-events:auto; cursor:pointer; }

  /* ============ RESULT ============ */
  #screen-result{ align-items:center; justify-content:center; text-align:center; padding:30px; background: repeating-linear-gradient(135deg, #070a12, #070a12 2px, #0a1220 2px, #0a1220 40px); }

  /* ============ MATCHMAKING ============ */
  #screen-matchmaking{ background: repeating-linear-gradient(135deg, #070a12, #070a12 2px, #0a1220 2px, #0a1220 40px); }
  .search-pulse{ width:100px; height:100px; border-radius:50%; border:3px solid var(--ember); position:relative; }
  .search-pulse::before, .search-pulse::after{
    content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--ember);
    animation:searchRing 1.8s ease-out infinite;
  }
  .search-pulse::after{ animation-delay:.6s; }
  @keyframes searchRing{ 0%{ transform:scale(1); opacity:1; } 100%{ transform:scale(2.4); opacity:0; } }
  .mm-title{ font-family:'Archivo Black', sans-serif; font-size:20px; letter-spacing:.1em; margin-top:34px; }
  .mm-sub{ font-size:12px; color:var(--steel); margin-top:8px; }

  /* ============ BATTLE ============ */
  .battle-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .battle-side{ text-align:center; width:36%; }
  .battle-name{ font-size:11px; letter-spacing:.1em; color:var(--bone); text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .battle-reps{ font-family:'Archivo Black', sans-serif; font-size:44px; margin-top:4px; color:var(--volt); text-shadow:0 0 16px rgba(95,240,255,.5), 0 2px 10px rgba(0,0,0,.6); }
  .battle-timer{ font-family:'Archivo Black', sans-serif; font-size:16px; background:rgba(0,0,0,.5); padding:8px 14px; border-radius:10px; margin-top:2px; }
  .result-title{ font-family:'Archivo Black', sans-serif; font-size:32px; }
  .result-title.win{ color:var(--volt); }
  .result-title.fail{ color:var(--ember); }
  .result-sub{ margin-top:8px; font-size:13px; color:var(--steel); }
  .result-xp{ margin-top:24px; font-family:'Archivo Black', sans-serif; font-size:20px; color:var(--volt); }
  .result-stack{ margin-top:34px; display:flex; flex-direction:column; gap:12px; width:100%; }
</style>
</head>
<body>

<div id="app">

  <!-- ================= HOME ================= -->
  <div class="screen active" id="screen-home">
    <div class="topbar" id="homeTopbar"></div>
    <div class="home-center">
      <div class="brand">
        <h1>PUMP<br><span>UP</span></h1>
        <p>Camera counts. You climb.</p>
      </div>
      <div class="stack" id="homeStack"></div>
    </div>
  </div>

  <!-- ================= LEVEL MAP ================= -->
  <div class="screen" id="screen-map">
    <div class="map-topbar">
      <div class="back-btn" onclick="goTo('home')">←</div>
      <div class="map-title" id="mapChapterTitle">CHAPTER 1</div>
      <div style="width:32px"></div>
    </div>
    <div class="path" id="levelPath"></div>
    <div class="chapter-nav">
      <div class="chapter-arrow" id="prevChapterBtn">‹ Prev</div>
      <div class="chapter-arrow" id="nextChapterBtn">Next ›</div>
    </div>
  </div>

  <!-- ================= WORKOUT ================= -->
  <div class="screen" id="screen-play">
    <div class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <div class="scrim-top"></div>
      <div class="scrim-bottom"></div>
      <div class="hud">
        <div class="hud-top">
          <div class="timer" id="timerLabel">0:00</div>
          <div class="lvl-badge" id="playLvlBadge">LEVEL 1</div>
        </div>
        <div class="challenge-wrap">
          <span class="challenge-label" id="challengeLabel">0</span>
          <div class="challenge-track"><div class="challenge-fill" id="challengeFill"></div></div>
          <span class="challenge-label" id="challengeTarget">/ 10</span>
        </div>
        <div class="hero">
          <div class="rep-number" id="repCount">0</div>
          <div class="rep-of">REPS</div>
          <div class="state-pill" id="stateTag">—</div>
          <div class="depth-bar-track" id="depthBarTrack">
            <div class="depth-bar-fill" id="depthBarFill"></div>
          </div>
        </div>
        <div class="bottom-hud">
          <div></div>
          <div class="quit" onclick="quitLevel()">QUIT</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MATCHMAKING ================= -->
  <div class="screen" id="screen-matchmaking" style="align-items:center; justify-content:center; text-align:center; padding:30px;">
    <div class="search-pulse"></div>
    <div class="mm-title">SEARCHING…</div>
    <div class="mm-sub">Finding an opponent</div>
    <div class="btn disabled" id="cancelSearchBtn" style="margin-top:40px; color:var(--bone); border-color:var(--steel); cursor:pointer;">CANCEL</div>
  </div>

  <!-- ================= BATTLE (1v1) ================= -->
  <div class="screen" id="screen-battle">
    <div class="stage">
      <video id="battleVideo" playsinline autoplay muted></video>
      <canvas id="battleCanvas"></canvas>
      <div class="scrim-top"></div>
      <div class="scrim-bottom"></div>
      <div class="hud">
        <div class="battle-top">
          <div class="battle-side">
            <div class="battle-name">YOU</div>
            <div class="battle-reps" id="myReps">0</div>
          </div>
          <div class="battle-timer" id="battleTimer">0:60</div>
          <div class="battle-side">
            <div class="battle-name" id="oppName">OPPONENT</div>
            <div class="battle-reps" id="oppReps">0</div>
          </div>
        </div>
        <div class="hero">
          <div class="state-pill" id="battleStateTag">—</div>
          <div class="depth-bar-track"><div class="depth-bar-fill" id="battleDepthFill"></div></div>
        </div>
        <div class="bottom-hud">
          <div></div>
          <div class="quit" onclick="quitBattle()">QUIT</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= RESULT ================= -->
  <div class="screen" id="screen-result">
    <div class="result-title" id="resultTitle">—</div>
    <div class="result-sub" id="resultSub">—</div>
    <div class="result-xp" id="resultXp"></div>
    <div class="result-stack" id="resultStack"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  signInAnonymously, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, onSnapshot,
  collection, query, where, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCevdh6hPMg4DqpwPlhbFyecGcSO5dITE",
  authDomain: "pump-462fe.firebaseapp.com",
  projectId: "pump-462fe",
  storageBucket: "pump-462fe.firebasestorage.app",
  messagingSenderId: "773870961352",
  appId: "1:773870961352:web:7d17711e99926edec75bfd",
  measurementId: "G-THH5SQEH2X"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const provider = new GoogleAuthProvider();

// ============ LEVEL DATA (generated: 100 regular levels + a boss every 10th) ============
const LEVELS = [];
for (let i = 1; i <= 100; i++) {
  const target = 5 + Math.floor(i * 1.2);       // gently rising difficulty
  const timeLimit = 60 + Math.floor(i / 10) * 5; // slightly more time in later chapters
  const xpReward = 10 + i * 3;
  LEVELS.push({ id: i, target, timeLimit, xpReward, chapter: Math.ceil(i / 10) });
  if (i % 10 === 0) {
    LEVELS.push({
      id: 'boss' + (i / 10),
      target: target + 10,
      timeLimit: timeLimit + 30,
      xpReward: xpReward * 2,
      chapter: i / 10,
      isBoss: true
    });
  }
}
const TOTAL_CHAPTERS = 10;
let currentChapter = 1;

function rankForXP(xp){
  if (xp >= 6000) return 'Titan';
  if (xp >= 4000) return 'Legend';
  if (xp >= 2500) return 'Elite';
  if (xp >= 1200) return 'Beast';
  if (xp >= 500) return 'Grinder';
  if (xp >= 100) return 'Climber';
  return 'Rookie';
}

// ============ STATE ============
let currentUser = null;
let progress = { totalXP: 0, levelsCompleted: [], currentUnlockedLevel: 1 };
let activeLevel = null;
let repCount = 0, pushupState = 'UP';
let timeLeft = 0, timerInterval = null;
let cameraStream = null;
let trackingReady = false;
let lastRepTime = 0;
const MIN_MS_BETWEEN_REPS = 300; // a real pushup can't physically happen faster than this — filters noise spikes

// ============ SCREEN ROUTER ============
window.goTo = function(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'map') {
    const unlockedLvl = LEVELS.find(l => l.id === progress.currentUnlockedLevel);
    if (unlockedLvl) currentChapter = unlockedLvl.chapter;
    renderLevelMap();
  }
  if (name !== 'play') stopCamera();
};

// ============ FIRESTORE PROGRESS ============
async function loadProgress(uid){
  const ref = doc(db, 'pumpup_users', uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    progress = snap.data();
  } else {
    progress = { totalXP: 0, levelsCompleted: [], currentUnlockedLevel: 1 };
    await setDoc(ref, progress);
  }
}
async function saveProgress(){
  if (!currentUser) return;
  const ref = doc(db, 'pumpup_users', currentUser.uid);
  await setDoc(ref, progress);
}

// ============ HOME SCREEN ============
function renderHomeSignedOut(){
  document.getElementById('homeTopbar').innerHTML = `<div class="coin"><span class="dot"></span>0</div><div></div>`;
  document.getElementById('homeStack').innerHTML = `
    <div class="signed-out-cta">
      <p>Sign in to save your progress</p>
      <button class="google-btn" id="googleSignInBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C41.6 35.9 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Sign in with Google
      </button>
      <div class="guest-btn" id="guestSignInBtn">Continue as Guest</div>
      <div id="authError" style="font-size:11px; color:var(--ember); min-height:14px;"></div>
    </div>`;
  const errEl = document.getElementById('authError');
  document.getElementById('googleSignInBtn').addEventListener('click', () => {
    errEl.textContent = 'Opening Google sign-in…';
    signInWithPopup(auth, provider)
      .catch(async (err) => {
        console.error(err);
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
          errEl.textContent = 'Popup blocked — trying redirect…';
          try { await signInWithRedirect(auth, provider); }
          catch (e2) { errEl.textContent = 'Error: ' + e2.code; }
        } else {
          errEl.textContent = 'Error: ' + err.code;
        }
      });
  });
  document.getElementById('guestSignInBtn').addEventListener('click', () => {
    errEl.textContent = 'Signing in as guest…';
    signInAnonymously(auth).catch(err => {
      console.error(err);
      errEl.textContent = 'Error: ' + err.code;
    });
  });
}
function renderHomeSignedIn(user){
  const isGuest = user.isAnonymous;
  document.getElementById('homeTopbar').innerHTML = `
    <div class="coin"><span class="dot"></span>${progress.totalXP}</div>
    <div class="profile-chip">
      <div class="profile-text">
        <span class="profile-name">${isGuest ? 'Guest' : (user.displayName || 'Player')}</span>
        <span class="profile-rank">${rankForXP(progress.totalXP)}</span>
      </div>
      ${isGuest ? '' : `<img class="avatar" src="${user.photoURL || ''}" alt="avatar">`}
    </div>`;
  document.getElementById('homeStack').innerHTML = `
    <div class="btn primary" onclick="goTo('map')">LEVELS</div>
    <div class="btn disabled">NORMAL — Soon</div>
    <div class="btn primary" onclick="startMatchmaking()">ONLINE</div>
    <div class="mini-links">
      <span id="feedbackBtn">Feedback</span>
      <span id="logoutBtn">Log out</span>
    </div>`;
  document.getElementById('feedbackBtn').addEventListener('click', openFeedback);
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
}

async function openFeedback(){
  const msg = window.prompt('What should we improve? (a few words is enough)');
  if (!msg || !msg.trim()) return;
  try {
    await setDoc(doc(db, 'feedback', Date.now() + '_' + (currentUser ? currentUser.uid : 'anon')), {
      uid: currentUser ? currentUser.uid : null,
      message: msg.trim(),
      createdAt: Date.now()
    });
    alert('Thanks — feedback sent!');
  } catch (err) {
    console.error(err);
    alert('Could not send feedback right now.');
  }
}

// Catch the result when the browser returns from the Google redirect flow
getRedirectResult(auth).catch(err => console.error('Redirect sign-in error:', err));

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    await loadProgress(user.uid);
    renderHomeSignedIn(user);
  } else {
    progress = { totalXP: 0, levelsCompleted: [], currentUnlockedLevel: 1 };
    renderHomeSignedOut();
  }
});

// ============ LEVEL MAP ============
const NODE_POS = ['n1','n2','n3','n4','n5','n6','n7','n8','n9','n10','nboss'];

function renderLevelMap(){
  document.getElementById('mapChapterTitle').textContent = 'CHAPTER ' + currentChapter;
  const pathEl = document.getElementById('levelPath');
  pathEl.innerHTML = '';

  const chapterLevels = LEVELS.filter(l => l.chapter === currentChapter);
  chapterLevels.forEach((lvl, i) => {
    const done = progress.levelsCompleted.includes(lvl.id);
    const isNext = !done && lvl.id === progress.currentUnlockedLevel;
    let cls = 'locked';
    if (done) cls = 'done';
    else if (isNext) cls = 'open';
    const node = document.createElement('div');
    node.className = `node ${cls} ${lvl.isBoss ? 'boss' : ''} ${NODE_POS[i]}`;
    node.textContent = lvl.isBoss ? 'BOSS' : lvl.id;
    if (cls !== 'locked') {
      node.addEventListener('click', () => startLevel(lvl));
    }
    pathEl.appendChild(node);
  });

  const prevBtn = document.getElementById('prevChapterBtn');
  const nextBtn = document.getElementById('nextChapterBtn');
  prevBtn.className = 'chapter-arrow' + (currentChapter <= 1 ? ' disabled' : '');
  nextBtn.className = 'chapter-arrow' + (currentChapter >= TOTAL_CHAPTERS ? ' disabled' : '');
  prevBtn.onclick = () => { if (currentChapter > 1) { currentChapter--; renderLevelMap(); } };
  nextBtn.onclick = () => { if (currentChapter < TOTAL_CHAPTERS) { currentChapter++; renderLevelMap(); } };
}

// ============ WORKOUT LOGIC ============
function startLevel(lvl){
  activeLevel = lvl;
  repCount = 0;
  pushupState = 'UP';
  trackingReady = false;
  lastRepTime = 0;
  angleBuffer = [];
  timeLeft = lvl.timeLimit;
  warmUpSpeech();
  document.getElementById('repCount').textContent = '0';
  document.getElementById('challengeLabel').textContent = '0';
  document.getElementById('challengeTarget').textContent = '/ ' + lvl.target;
  document.getElementById('challengeFill').style.width = '0%';
  document.getElementById('playLvlBadge').textContent = lvl.isBoss ? 'BOSS' : ('LEVEL ' + lvl.id);
  document.getElementById('timerLabel').textContent = formatTime(timeLeft);
  goTo('play');
  startCamera();
  setTimeout(() => {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance("Let's go!");
      utter.rate = 1.2;
      window.speechSynthesis.speak(utter);
    }
  }, 1600);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timerLabel').textContent = formatTime(timeLeft);
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      finishLevel(repCount >= activeLevel.target);
    }
  }, 1000);
}

function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

function quitLevel(){
  clearInterval(timerInterval);
  stopCamera();
  goTo('map');
}

async function finishLevel(won){
  clearInterval(timerInterval);
  stopCamera();
  const titleEl = document.getElementById('resultTitle');
  const subEl = document.getElementById('resultSub');
  const xpEl = document.getElementById('resultXp');
  const stackEl = document.getElementById('resultStack');

  if (won) {
    const firstClear = !progress.levelsCompleted.includes(activeLevel.id);
    if (firstClear) {
      progress.levelsCompleted.push(activeLevel.id);
      progress.totalXP += activeLevel.xpReward;
      const idx = LEVELS.findIndex(l => l.id === activeLevel.id);
      const next = LEVELS[idx + 1];
      if (next) progress.currentUnlockedLevel = next.id;
      await saveProgress();
    }
    titleEl.textContent = 'LEVEL CLEAR';
    titleEl.className = 'result-title win';
    subEl.textContent = repCount + ' reps in ' + activeLevel.timeLimit + 's';
    xpEl.textContent = firstClear ? ('+' + activeLevel.xpReward + ' XP') : 'Already cleared';
  } else {
    titleEl.textContent = 'TIME UP';
    titleEl.className = 'result-title fail';
    subEl.textContent = 'Got ' + repCount + ' / ' + activeLevel.target + ' — try again';
    xpEl.textContent = '';
  }

  stackEl.innerHTML = `
    <div class="btn primary" onclick="retryLevel()">RETRY</div>
    <div class="btn disabled" style="color:var(--bone); border-color:var(--line);" onclick="goTo('map')">BACK TO MAP</div>`;
  goTo('result');
}

window.retryLevel = function(){ startLevel(activeLevel); };
window.quitLevel = quitLevel;

// ============ POSE TRACKING + REP LOGIC ============
const videoEl = document.getElementById('video');
const canvasEl = document.getElementById('canvas');
const ctx = canvasEl.getContext('2d');
const repCountEl = document.getElementById('repCount');
const stateTagEl = document.getElementById('stateTag');
const depthBarFillEl = document.getElementById('depthBarFill');
const challengeFillEl = document.getElementById('challengeFill');
const challengeLabelEl = document.getElementById('challengeLabel');

const DOWN_ANGLE_THRESHOLD = 110;
const UP_ANGLE_THRESHOLD = 150;
const L_SHOULDER = 11, L_ELBOW = 13, L_WRIST = 15;
const R_SHOULDER = 12, R_ELBOW = 14, R_WRIST = 16;

function angleBetween(a, b, c) {
  const ab = { x: a.x - b.x, y: a.y - b.y, z: (a.z || 0) - (b.z || 0) };
  const cb = { x: c.x - b.x, y: c.y - b.y, z: (c.z || 0) - (b.z || 0) };
  const dot = ab.x * cb.x + ab.y * cb.y + ab.z * cb.z;
  const magAB = Math.hypot(ab.x, ab.y, ab.z);
  const magCB = Math.hypot(cb.x, cb.y, cb.z);
  if (magAB === 0 || magCB === 0) return null;
  const cos = Math.min(1, Math.max(-1, dot / (magAB * magCB)));
  return (Math.acos(cos) * 180) / Math.PI;
}

function getElbowAngleRaw(landmarks) {
  const minVis = 0.5;
  const leftVis = (landmarks[L_SHOULDER].visibility + landmarks[L_ELBOW].visibility + landmarks[L_WRIST].visibility) / 3;
  const rightVis = (landmarks[R_SHOULDER].visibility + landmarks[R_ELBOW].visibility + landmarks[R_WRIST].visibility) / 3;

  // Pick whichever side is more clearly visible instead of averaging both —
  // more robust when one arm is angled away from or blocked from the camera.
  if (leftVis > minVis && leftVis >= rightVis) {
    return angleBetween(landmarks[L_SHOULDER], landmarks[L_ELBOW], landmarks[L_WRIST]);
  } else if (rightVis > minVis) {
    return angleBetween(landmarks[R_SHOULDER], landmarks[R_ELBOW], landmarks[R_WRIST]);
  }
  return null;
}

const ANGLE_BUFFER_SIZE = 5;
let angleBuffer = [];
function smoothAngleWith(val, buffer){
  buffer.push(val);
  if (buffer.length > ANGLE_BUFFER_SIZE) buffer.shift();
  return buffer.reduce((a, b) => a + b, 0) / buffer.length;
}
function getElbowAngle(landmarks) {
  const rawAngle = getElbowAngleRaw(landmarks);
  if (rawAngle === null) return null;
  return smoothAngleWith(rawAngle, angleBuffer);
}

function updateChallengeUI(){
  const pct = Math.min(100, (repCount / activeLevel.target) * 100);
  challengeFillEl.style.width = pct + '%';
  challengeLabelEl.textContent = repCount;
}

let speechWarmedUp = false;
function warmUpSpeech(){
  // Mobile TTS engines often have a slow first-utterance startup — speaking a
  // silent utterance once, early, avoids that delay showing up on the first
  // real rep count.
  if (!('speechSynthesis' in window) || speechWarmedUp) return;
  const warm = new SpeechSynthesisUtterance(' ');
  warm.volume = 0;
  window.speechSynthesis.speak(warm);
  speechWarmedUp = true;
}

function speakRep(count){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel(); // always announce the latest count, don't queue behind stale ones
  const utter = new SpeechSynthesisUtterance(String(count));
  utter.rate = 1.6;
  utter.volume = 1;
  window.speechSynthesis.speak(utter);
}

const MOTIVATION_LINES = ["Come on!", "Keep going!", "You got this!", "Push!", "Nice pace!"];
function speakMotivation(){
  if (!('speechSynthesis' in window) || !activeLevel) return;
  const remaining = activeLevel.target - repCount;
  let line = null;
  if (remaining === 1) line = "Last one, you got this!";
  else if (remaining === 0) return; // finishLevel's own flow handles the finish
  else if (repCount > 0 && repCount % 5 === 0) line = MOTIVATION_LINES[Math.floor(Math.random() * MOTIVATION_LINES.length)];
  if (!line) return;
  // Let the number finish first, then layer the motivational line on top
  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(line);
    utter.rate = 1.1;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }, 350);
}

function updateDepthBar(angle){
  // Map angle to a 0-100% "depth" bar: fully DOWN = 100%, fully UP = 0%
  const clamped = Math.min(180, Math.max(60, angle));
  const pct = Math.round(((180 - clamped) / (180 - 60)) * 100);
  depthBarFillEl.style.width = pct + '%';
}

function processRepLogic(landmarks) {
  const angle = getElbowAngle(landmarks);
  if (angle === null) { stateTagEl.textContent = 'ARMS N/A'; return; }

  if (!trackingReady) { return; } // let pose tracking settle before we start counting

  updateDepthBar(angle);

  if (angle < DOWN_ANGLE_THRESHOLD && pushupState === 'UP') {
    pushupState = 'DOWN';
  } else if (angle > UP_ANGLE_THRESHOLD && pushupState === 'DOWN') {
    const now = Date.now();
    if (now - lastRepTime < MIN_MS_BETWEEN_REPS) { pushupState = 'UP'; return; } // filter noise spikes
    lastRepTime = now;
    pushupState = 'UP';
    repCount++;
    repCountEl.textContent = repCount;
    updateChallengeUI();
    speakRep(repCount);
    speakMotivation();
    if (repCount >= activeLevel.target) {
      finishLevel(true);
    }
  }
  stateTagEl.textContent = pushupState;
}

function resizeCanvas(){ canvasEl.width = videoEl.clientWidth; canvasEl.height = videoEl.clientHeight; }
window.addEventListener('resize', resizeCanvas);

const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
pose.onResults((results) => {
  resizeCanvas();
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  if (results.poseLandmarks) {
    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, { color: 'rgba(46,166,255,0.65)', lineWidth: 2 });
    drawLandmarks(ctx, results.poseLandmarks, { color: 'rgba(95,240,255,0.85)', lineWidth: 1, radius: 3 });
    processRepLogic(results.poseLandmarks);
  } else {
    stateTagEl.textContent = 'GET IN FRAME';
  }
});

let frameLoopActive = false;
async function frameLoop(){
  if (!frameLoopActive) return;
  if (videoEl.readyState >= 2) await pose.send({ image: videoEl });
  requestAnimationFrame(frameLoop);
}

async function startCamera(){
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    videoEl.srcObject = cameraStream;
    await videoEl.play();
    frameLoopActive = true;
    requestAnimationFrame(frameLoop);
    stateTagEl.textContent = 'GET READY...';
    setTimeout(() => { trackingReady = true; }, 1500);
  } catch (err) {
    stateTagEl.textContent = 'CAMERA DENIED';
    console.error(err);
  }
}
function stopCamera(){
  frameLoopActive = false;
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

// ============ ONLINE 1v1 MATCHMAKING ============
let queueUnsub = null;
let matchFindInterval = null;
let battleMatchId = null;
let battleMatchUnsub = null;
let mySlot = null; // 'player1' or 'player2'
let battleRepCount = 0, battlePushupState = 'UP', battleAngleBuffer = [];
let battleTrackingReady = false, battleLastRepTime = 0;
let battleCameraStream = null, battleFrameLoopActive = false;
let battleTimerInterval = null;
let battleStartTimeMs = 0, battleDuration = 60;
let battleFinished = false;

window.startMatchmaking = function(){
  if (!currentUser) return;
  goTo('matchmaking');
  document.getElementById('cancelSearchBtn').onclick = cancelMatchmaking;

  const myUid = currentUser.uid;
  const myName = currentUser.isAnonymous ? 'Guest' : (currentUser.displayName || 'Player');

  setDoc(doc(db, 'matchmaking_queue', myUid), { displayName: myName, joinedAt: Date.now() }).catch(console.error);

  // Listen for someone else matching me into an active match
  const q = query(collection(db, 'matches'), where('players', 'array-contains', myUid), where('status', '==', 'active'));
  queueUnsub = onSnapshot(q, (snap) => {
    snap.forEach((docSnap) => {
      const data = docSnap.data();
      handleMatchFound(docSnap.id, data, myUid);
    });
  });

  // Every 2s, try to pair myself with someone else waiting
  matchFindInterval = setInterval(async () => {
    try {
      const qWaiting = query(collection(db, 'matchmaking_queue'), orderBy('joinedAt'), limit(5));
      const snap = await getDocs(qWaiting);
      const candidate = snap.docs.find(d => d.id !== myUid);
      if (candidate) {
        const opponentUid = candidate.id;
        const opponentName = candidate.data().displayName;
        const matchId = myUid < opponentUid ? (myUid + '_' + opponentUid) : (opponentUid + '_' + myUid);
        const matchRef = doc(db, 'matches', matchId);
        const existing = await getDoc(matchRef);
        if (!existing.exists()) {
          await setDoc(matchRef, {
            players: [myUid, opponentUid],
            player1: { uid: myUid, displayName: myName },
            player2: { uid: opponentUid, displayName: opponentName },
            player1Reps: 0, player2Reps: 0,
            startTime: Date.now(),
            duration: 60,
            status: 'active',
            winner: null
          });
          await deleteDoc(doc(db, 'matchmaking_queue', myUid)).catch(() => {});
          await deleteDoc(doc(db, 'matchmaking_queue', opponentUid)).catch(() => {});
        }
      }
    } catch (err) { console.error('Matchmaking error:', err); }
  }, 2000);
};

function handleMatchFound(matchId, data, myUid){
  if (battleMatchId) return; // already entered
  battleMatchId = matchId;
  mySlot = data.player1.uid === myUid ? 'player1' : 'player2';
  clearInterval(matchFindInterval);
  if (queueUnsub) queueUnsub();
  deleteDoc(doc(db, 'matchmaking_queue', myUid)).catch(() => {});
  enterBattle(matchId, data);
}

function cancelMatchmaking(){
  clearInterval(matchFindInterval);
  if (queueUnsub) queueUnsub();
  if (currentUser) deleteDoc(doc(db, 'matchmaking_queue', currentUser.uid)).catch(() => {});
  goTo('home');
}

function enterBattle(matchId, initialData){
  battleRepCount = 0;
  battlePushupState = 'UP';
  battleAngleBuffer = [];
  battleTrackingReady = false;
  battleLastRepTime = 0;
  battleFinished = false;
  battleStartTimeMs = initialData.startTime;
  battleDuration = initialData.duration;

  const oppData = mySlot === 'player1' ? initialData.player2 : initialData.player1;
  document.getElementById('oppName').textContent = (oppData.displayName || 'OPPONENT').toUpperCase();
  document.getElementById('myReps').textContent = '0';
  document.getElementById('oppReps').textContent = '0';

  goTo('battle');
  startBattleCamera();
  setTimeout(() => { battleTrackingReady = true; }, 1500);

  const matchRef = doc(db, 'matches', matchId);
  battleMatchUnsub = onSnapshot(matchRef, (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();
    const oppReps = mySlot === 'player1' ? d.player2Reps : d.player1Reps;
    document.getElementById('oppReps').textContent = oppReps;
    if (d.status === 'finished' && !battleFinished) {
      battleFinished = true;
      showBattleResult(d);
    }
  });

  clearInterval(battleTimerInterval);
  battleTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - battleStartTimeMs) / 1000);
    const left = Math.max(0, battleDuration - elapsed);
    document.getElementById('battleTimer').textContent = formatTime(left);
    if (left <= 0) {
      clearInterval(battleTimerInterval);
      finalizeBattle();
    }
  }, 500);
}

async function finalizeBattle(){
  if (battleFinished) return;
  const matchRef = doc(db, 'matches', battleMatchId);
  const snap = await getDoc(matchRef);
  if (!snap.exists() || snap.data().status === 'finished') return;
  const d = snap.data();
  const p1 = d.player1Reps, p2 = d.player2Reps;
  let winner = null;
  if (p1 > p2) winner = d.player1.uid;
  else if (p2 > p1) winner = d.player2.uid;
  await updateDoc(matchRef, { status: 'finished', winner }).catch(console.error);
}

function showBattleResult(matchData){
  clearInterval(battleTimerInterval);
  stopBattleCamera();
  if (battleMatchUnsub) battleMatchUnsub();

  const myReps = mySlot === 'player1' ? matchData.player1Reps : matchData.player2Reps;
  const oppReps = mySlot === 'player1' ? matchData.player2Reps : matchData.player1Reps;
  const iWon = matchData.winner === currentUser.uid;
  const isDraw = matchData.winner === null;

  const titleEl = document.getElementById('resultTitle');
  const subEl = document.getElementById('resultSub');
  const xpEl = document.getElementById('resultXp');
  const stackEl = document.getElementById('resultStack');

  if (isDraw) {
    titleEl.textContent = 'DRAW';
    titleEl.className = 'result-title';
    subEl.textContent = myReps + ' — ' + oppReps;
    xpEl.textContent = '';
  } else if (iWon) {
    titleEl.textContent = 'YOU WON';
    titleEl.className = 'result-title win';
    subEl.textContent = myReps + ' — ' + oppReps;
    const xpGain = 25;
    progress.totalXP += xpGain;
    saveProgress();
    xpEl.textContent = '+' + xpGain + ' XP';
  } else {
    titleEl.textContent = 'YOU LOST';
    titleEl.className = 'result-title fail';
    subEl.textContent = myReps + ' — ' + oppReps;
    xpEl.textContent = '';
  }

  stackEl.innerHTML = `
    <div class="btn primary" onclick="goTo('home')">BACK HOME</div>`;
  battleMatchId = null;
  mySlot = null;
  goTo('result');
}

window.quitBattle = async function(){
  clearInterval(battleTimerInterval);
  stopBattleCamera();
  if (battleMatchUnsub) battleMatchUnsub();
  if (battleMatchId && currentUser) {
    const matchRef = doc(db, 'matches', battleMatchId);
    const snap = await getDoc(matchRef);
    if (snap.exists() && snap.data().status !== 'finished') {
      const d = snap.data();
      const opponentUid = mySlot === 'player1' ? d.player2.uid : d.player1.uid;
      await updateDoc(matchRef, { status: 'finished', winner: opponentUid }).catch(() => {});
    }
  }
  battleMatchId = null;
  mySlot = null;
  goTo('map');
};

// ---- Battle camera + rep tracking (mirrors level workout logic) ----
const battleVideoEl = document.getElementById('battleVideo');
const battleCanvasEl = document.getElementById('battleCanvas');
const battleCtx = battleCanvasEl.getContext('2d');
const battleStateTagEl = document.getElementById('battleStateTag');
const battleDepthFillEl = document.getElementById('battleDepthFill');
const myRepsEl = document.getElementById('myReps');

function battleResizeCanvas(){ battleCanvasEl.width = battleVideoEl.clientWidth; battleCanvasEl.height = battleVideoEl.clientHeight; }
window.addEventListener('resize', battleResizeCanvas);

const battlePose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
battlePose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
battlePose.onResults((results) => {
  battleResizeCanvas();
  battleCtx.clearRect(0, 0, battleCanvasEl.width, battleCanvasEl.height);
  if (results.poseLandmarks) {
    drawConnectors(battleCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: 'rgba(46,166,255,0.65)', lineWidth: 2 });
    drawLandmarks(battleCtx, results.poseLandmarks, { color: 'rgba(95,240,255,0.85)', lineWidth: 1, radius: 3 });
    processBattleRepLogic(results.poseLandmarks);
  } else {
    battleStateTagEl.textContent = 'GET IN FRAME';
  }
});

function processBattleRepLogic(landmarks){
  const rawAngle = getElbowAngleRaw(landmarks);
  if (rawAngle === null) { battleStateTagEl.textContent = 'ARMS N/A'; return; }
  const angle = smoothAngleWith(rawAngle, battleAngleBuffer);
  if (!battleTrackingReady) return;

  const clamped = Math.min(180, Math.max(60, angle));
  battleDepthFillEl.style.width = Math.round(((180 - clamped) / (180 - 60)) * 100) + '%';

  if (angle < DOWN_ANGLE_THRESHOLD && battlePushupState === 'UP') {
    battlePushupState = 'DOWN';
  } else if (angle > UP_ANGLE_THRESHOLD && battlePushupState === 'DOWN') {
    const now = Date.now();
    if (now - battleLastRepTime < MIN_MS_BETWEEN_REPS) { battlePushupState = 'UP'; return; }
    battleLastRepTime = now;
    battlePushupState = 'UP';
    battleRepCount++;
    myRepsEl.textContent = battleRepCount;
    speakRep(battleRepCount);
    const field = mySlot === 'player1' ? 'player1Reps' : 'player2Reps';
    updateDoc(doc(db, 'matches', battleMatchId), { [field]: battleRepCount }).catch(console.error);
  }
  battleStateTagEl.textContent = battlePushupState;
}

async function startBattleCamera(){
  try {
    battleCameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    battleVideoEl.srcObject = battleCameraStream;
    await battleVideoEl.play();
    battleFrameLoopActive = true;
    requestAnimationFrame(battleFrameLoop);
    battleStateTagEl.textContent = 'GET READY...';
  } catch (err) {
    battleStateTagEl.textContent = 'CAMERA DENIED';
    console.error(err);
  }
}
async function battleFrameLoop(){
  if (!battleFrameLoopActive) return;
  if (battleVideoEl.readyState >= 2) await battlePose.send({ image: battleVideoEl });
  requestAnimationFrame(battleFrameLoop);
}
function stopBattleCamera(){
  battleFrameLoopActive = false;
  if (battleCameraStream) {
    battleCameraStream.getTracks().forEach(t => t.stop());
    battleCameraStream = null;
  }
}
</script>
