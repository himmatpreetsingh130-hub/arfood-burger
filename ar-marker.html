<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marker AR — ARFOOD.STUDIO</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; overflow: hidden; background: #000; }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
        }
        .back-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .model-label {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .instructions {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            padding: 20px 20px 30px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85), transparent);
            color: #fff;
            text-align: center;
        }
        .instructions p {
            font-size: 0.85rem;
            color: #ddd;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .marker-preview {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            margin: 0 auto 10px;
            background: #fff;
            padding: 4px;
        }
        .marker-preview img { width: 100%; height: 100%; object-fit: contain; }
        .show-marker-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Fullscreen marker display (for when a second device shows the marker) */
        .marker-fullscreen {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #fff;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        .marker-fullscreen.active { display: flex; }
        .marker-fullscreen img { width: 60vw; max-width: 400px; }
        .marker-fullscreen p { font-size: 0.9rem; color: #333; text-align: center; padding: 0 20px; }
        .marker-fullscreen button {
            padding: 12px 30px;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .loading-msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            color: #fff;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.6);
            padding: 12px 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="back-btn" onclick="window.close(); window.location.href='index.html';">←</button>
        <div class="model-label" id="modelLabel">Model</div>
        <div style="width:40px;"></div>
    </div>

    <div class="loading-msg" id="loadingMsg">Starting camera...</div>

    <div class="instructions">
        <div class="marker-preview">
            <img src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/images/hiro.png" alt="Hiro marker">
        </div>
        <p>Print this marker, or tap below to show it full-screen on another phone/screen. Point THIS camera at it.</p>
        <button class="show-marker-btn" onclick="document.getElementById('markerFullscreen').classList.add('active')">Show Marker Full-Screen</button>
    </div>

    <div class="marker-fullscreen" id="markerFullscreen">
        <img src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/images/hiro.png" alt="Hiro marker">
        <p>Hold this screen still. Point the OTHER phone's camera at this marker.</p>
        <button onclick="document.getElementById('markerFullscreen').classList.remove('active')">Close</button>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

        <a-assets>
            <a-asset-item id="modelAsset" src=""></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="hiroMarker">
            <a-entity id="modelEntity" gltf-model="#modelAsset" normalize-scale position="0 0 0"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Auto-fit any GLB into a consistent, sensible size on the marker,
        // since real-world scale varies a lot between your 19 models.
        AFRAME.registerComponent('normalize-scale', {
            schema: { size: { type: 'number', default: 0.3 } },
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const THREE = AFRAME.THREE;
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    const box = new THREE.Box3().setFromObject(obj);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    if (maxDim > 0) {
                        const scale = this.data.size / maxDim;
                        this.el.object3D.scale.set(scale, scale, scale);
                        const center = new THREE.Vector3();
                        box.getCenter(center);
                        this.el.object3D.position.set(-center.x * scale, -center.y * scale, -center.z * scale);
                    }
                    document.getElementById('loadingMsg').style.display = 'none';
                });
            }
        });

        // Read ?model=xxx.glb&name=Model+Name from the URL
        const params = new URLSearchParams(window.location.search);
        const modelFile = params.get('model');
        const modelName = params.get('name') || 'Model';
        document.getElementById('modelLabel').textContent = modelName;

        if (modelFile) {
            document.getElementById('modelAsset').setAttribute('src', modelFile);
        } else {
            document.getElementById('loadingMsg').textContent = 'No model specified in URL.';
        }

        // AR.js fires this on the scene when the camera feed is ready.
        document.querySelector('a-scene').addEventListener('arReady', () => {
            document.getElementById('loadingMsg').textContent = 'Point camera at the marker below.';
        });
    </script>
</body>
</html>
